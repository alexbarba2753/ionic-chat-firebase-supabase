<div class="search-bar-container">
  <ion-searchbar
    class="search-input"
    [value]="query()"
    [placeholder]="placeholder"
    [debounce]="150"
    searchIcon="search-outline"
    (ionInput)="onSearchInput($event)"
    (ionClear)="onClear()"
  ></ion-searchbar>

  <div class="search-controls">
    @if (query().trim()) {
      <span class="match-counter">
        @if (matches().length > 0) {
          {{ activeIndex() + 1 }} / {{ matches().length }}
        } @else {
          0
        }
      </span>
    }

    <ion-button
      type="button"
      fill="clear"
      size="small"
      aria-label="Coincidencia anterior"
      [disabled]="matches().length === 0"
      (click)="onPreviousMatch()"
    >
      <ion-icon slot="icon-only" name="chevron-up-outline"></ion-icon>
    </ion-button>

    <ion-button
      type="button"
      fill="clear"
      size="small"
      aria-label="Coincidencia siguiente"
      [disabled]="matches().length === 0"
      (click)="onNextMatch()"
    >
      <ion-icon slot="icon-only" name="chevron-down-outline"></ion-icon>
    </ion-button>

    <ion-button type="button" fill="clear" size="small" aria-label="Cerrar buscador" (click)="onClose()">
      <ion-icon slot="icon-only" name="close-outline"></ion-icon>
    </ion-button>
  </div>
</div>

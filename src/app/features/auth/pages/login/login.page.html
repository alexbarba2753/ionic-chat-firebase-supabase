<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar sesion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-shell">
    <ion-card class="auth-card">
      <ion-card-header>
        <div class="brand-badge">
          <ion-icon name="chatbubbles-outline"></ion-icon>
        </div>
        <ion-card-title>Chat Multiplataforma</ion-card-title>
        <ion-card-subtitle>Firebase Auth + Firestore + Supabase</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="field-item">
            <ion-input
              label="Correo electronico"
              labelPlacement="floating"
              fill="outline"
              type="email"
              autocomplete="email"
              formControlName="email"
            ></ion-input>
          </div>

          <div class="field-item">
            <ion-input
              label="Contrasena"
              labelPlacement="floating"
              fill="outline"
              type="password"
              autocomplete="current-password"
              formControlName="password"
            >
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
          </div>

          @if (errorMessage()) {
          <ion-text color="danger">
            <p class="error-banner">{{ errorMessage() }}</p>
          </ion-text>
          }

          <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="loading()">
            @if (loading()) {
            <ion-spinner name="crescent"></ion-spinner>
            } @else { Entrar }
          </ion-button>
        </form>

        <ion-button
          expand="block"
          fill="outline"
          color="medium"
          class="ion-margin-top"
          [disabled]="loading()"
          (click)="onGoogleLogin()"
        >
          <ion-icon slot="start" name="logo-google"></ion-icon>
          Continuar con Google
        </ion-button>

        <div class="auth-links">
          <ion-button fill="clear" size="small" (click)="onForgotPassword()"> Olvide mi contrasena </ion-button>
          <ion-button fill="clear" size="small" routerLink="/auth/register"> Crear cuenta </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-shell">
    <ion-card class="auth-card">
      <ion-card-header>
        <ion-card-title>Nuevo usuario</ion-card-title>
        <ion-card-subtitle>Registra tu cuenta y sincroniza tu perfil</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="field-item">
            <ion-input
              label="Nombre completo"
              labelPlacement="floating"
              fill="outline"
              type="text"
              formControlName="displayName"
            ></ion-input>
          </div>

          <div class="field-item">
            <ion-input
              label="Usuario (sin espacios)"
              labelPlacement="floating"
              fill="outline"
              type="text"
              formControlName="username"
            ></ion-input>
          </div>

          <div class="field-item">
            <ion-input
              label="Correo electronico"
              labelPlacement="floating"
              fill="outline"
              type="email"
              autocomplete="email"
              formControlName="email"
            ></ion-input>
          </div>

          <div class="field-item">
            <ion-input
              label="Contrasena"
              labelPlacement="floating"
              fill="outline"
              type="password"
              autocomplete="new-password"
              formControlName="password"
            >
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
          </div>

          <div class="field-item">
            <ion-input
              label="Confirmar contrasena"
              labelPlacement="floating"
              fill="outline"
              type="password"
              autocomplete="new-password"
              formControlName="confirmPassword"
            ></ion-input>
          </div>

          @if (errorMessage()) {
          <ion-text color="danger">
            <p class="error-banner">{{ errorMessage() }}</p>
          </ion-text>
          }

          <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="loading()">
            @if (loading()) {
            <ion-spinner name="crescent"></ion-spinner>
            } @else { Registrarme }
          </ion-button>
        </form>

        <div class="auth-footer">
          <ion-button fill="clear" size="small" routerLink="/auth/login"> Ya tengo una cuenta </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
